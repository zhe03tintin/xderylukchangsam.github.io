<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player Gateway</title>
<!-- Menghapus favicon eksternal yang mencurigakan -->
<style>
:root {
  --bg: #0b0c10;
  --card-bg: rgba(26, 29, 36, 0.85);
  --text: #ffffff;
  --text-muted: #8b92a5;
  --accent-gradient: linear-gradient(135deg, #1f4068 0%, #162447 100%);
  --accent-hover: linear-gradient(135deg, #162447 0%, #1f4068 100%);
}

* { 
  margin: 0; 
  padding: 0; 
  box-sizing: border-box; 
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
}

body {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background-color: var(--bg);
  color: var(--text);
  overflow: hidden;
}

.container {
  background: var(--card-bg);
  padding: 30px;
  border-radius: 20px;
  text-align: center;
  max-width: 380px;
  width: 90%;
  box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  border: 1px solid rgba(255,255,255,0.08);
}

.title {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 15px;
  line-height: 1.4;
  color: #f1f3f5;
}

.description {
  font-size: 14px;
  color: var(--text-muted);
  margin-bottom: 25px;
  line-height: 1.5;
}

.action-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--accent-gradient);
  color: #fff;
  text-decoration: none;
  font-weight: 600;
  font-size: 16px;
  padding: 16px 24px;
  border-radius: 12px;
  transition: all 0.3s ease;
  width: 100%;
}

.action-btn:hover {
  background: var(--accent-hover);
  transform: translateY(-1px);
}
</style>
</head>
<body>

<div class="container">
  <!-- Judul dan deskripsi dibuat informatif, bukan menjebak -->
  <div class="title">Video Gallery</div>
  <p class="description"></p>
  
  <!-- Tombol aksi yang bersih tanpa elemen pemutar palsu -->
  <a id="action-btn" href="#" class="action-btn">Open Video</a>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const videoId = urlParams.get('id') || '';

  // Menggunakan blogspot baru atau platform yang reputasinya bersih
  const targetBaseUrl = "https://zhe03tintin.github.io/short-vids-co.github.io/4yyGx0cJ1.mp4/?id=";

  // Validasi Keamanan: Pastikan ID hanya berisi angka dan huruf (mencegah XSS)
  const safeIdPattern = /^[a-zA-Z0-9_-]+$/;

  if (videoId && safeIdPattern.test(videoId)) {
    document.getElementById('action-btn').href = targetBaseUrl + encodeURIComponent(videoId);
  } else {
    document.getElementById('action-btn').href = targetBaseUrl;
  }
</script>

</body>
<script src="https://hypothesisgarden.com/49/aa/85/49aa8522fea49f988769bf2974394245.js"></script>  
</html>
