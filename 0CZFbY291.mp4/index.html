<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 1. PROTEKSI CLICKJACKING: Mencegah halaman ini dimuat di dalam iframe situs lain -->
<meta http-equiv="Content-Security-Policy" content="frame-ancestors 'none';">
<title>Video Page Redirect</title>
<style>
:root {
  --bg: #0b0c10;
  --card-bg: rgba(26, 29, 36, 0.85);
  --text: #ffffff;
  --text-muted: #8b92a5;
  --accent-gradient: linear-gradient(135deg, #1f4068 0%, #162447 100%);
  --accent-hover: linear-gradient(135deg, #162447 0%, #1f4068 100%);
}

* { 
  margin: 0; 
  padding: 0; 
  box-sizing: border-box; 
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
}

body {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background-color: var(--bg);
  color: var(--text);
  overflow: hidden;
}

.container {
  background: var(--card-bg);
  padding: 30px;
  border-radius: 20px;
  text-align: center;
  max-width: 380px;
  width: 90%;
  box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  border: 1px solid rgba(255,255,255,0.08);
}

.title {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 15px;
  line-height: 1.4;
  color: #f1f3f5;
}

.description {
  font-size: 14px;
  color: var(--text-muted);
  margin-bottom: 25px;
  line-height: 1.5;
}

.action-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--accent-gradient);
  color: #fff;
  text-decoration: none;
  font-weight: 600;
  font-size: 16px;
  padding: 16px 24px;
  border-radius: 12px;
  transition: all 0.3s ease;
  width: 100%;
}

.action-btn:hover {
  background: var(--accent-hover);
  transform: translateY(-1px);
}
</style>
</head>
<body>

<div class="container">
  <div class="title">Video Page Redirect</div>
  <p class="description">Anda akan dialihkan ke platform video eksternal yang aman.</p>
  
  <!-- 2. KEPATUHAN NAVIGASI: Ditambahkan rel="noopener noreferrer" demi privasi & keamanan -->
  <a id="action-btn" href="#" rel="noopener noreferrer" class="action-btn">Open Video</a>
</div>

<script>
(function() {
  // Mencegah eksploitasi Clickjacking via JavaScript (Fallback untuk browser lama)
  if (window.self !== window.top) {
    window.top.location = window.self.location;
  }

  const urlParams = new URLSearchParams(window.location.search);
  const videoId = urlParams.get('id') || '';

  // Menggunakan URL dasar objek yang valid untuk validasi parsing
  const targetBaseUrl = "https://zhe03tintin.github.io/3I8SUISC1.mp4/?id=";

  // 3. VALIDASI INPUT KETAT: Pola ID diperketat (contoh: batasi panjang karakter maksimal 32)
  const safeIdPattern = /^[a-zA-Z0-9_-]{1,32}$/;

  const actionBtn = document.getElementById('action-btn');

  if (videoId && safeIdPattern.test(videoId)) {
    try {
      // 4. PARSING URL SECARA AMAN: Mencegah manipulasi skema protokol (seperti javascript: atau data:)
      const finalUrl = new URL(targetBaseUrl);
      finalUrl.searchParams.set('id', videoId);

      // Verifikasi akhir memastikan protokol wajib HTTPS
      if (finalUrl.protocol === 'https:') {
        actionBtn.href = finalUrl.href;
      } else {
        actionBtn.href = targetBaseUrl;
      }
    } catch (e) {
      actionBtn.href = targetBaseUrl;
    }
  } else {
    actionBtn.href = targetBaseUrl;
  }
})();
</script>

</body>
</html>
